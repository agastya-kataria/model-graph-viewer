[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "model-graph-viewer"
version = "0.1.0"
description = "Port-aware neural network graph visualization with composable transformation passes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["graphviz>=0.21,<0.22", "openvino>=2026.0,<2027"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18", "build>=1.2,<2"]
inspection = ["netron==9.3.1", "playwright==1.63.0"]

[project.scripts]
model-graph-viewer = "model_graph_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_graph_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
